source: https://help.learnosity.com/hc/en-us/articles/360000758637-Getting-Started-With-the-Data-API
summary: >-
  Learnosity does not run a separate sandbox host. Instead it publishes an open
  "demos" account - a real consumer key/secret pair committed to every official SDK's
  quickstart config - which grants access to a demonstration Item bank and a fixed set
  of demo learner sessions on the production endpoints. There is no test/live key
  prefix; test mode is simply "you are signing with the demos consumer key".
test_vs_live:
  separation: separate consumer key per account (no key prefix convention)
  demo_account_name: Learnosity public demos account
  live_account: Learnosity provisions your own consumer key and secret; your Item bank
    and assessment data are tied to that key.
  key_prefixes: none
credentials:
  consumer_key: yis0TYCu7U9V4o7M
  consumer_secret_published_at:
  - https://github.com/Learnosity/learnosity-sdk-php/blob/master/docs/quickstart/config.php
  - https://github.com/Learnosity/learnosity-sdk-python/blob/master/docs/quickstart/config.py
  note: >-
    The demos consumer secret is published verbatim by Learnosity in each SDK's quickstart
    config file; it is deliberately public and grants access only to demonstration data.
    It is referenced here by location rather than copied, to keep this repo free of
    credential-shaped strings.
  domain_binding: >-
    The `domain` in the signed security object must match the host actually serving the
    page. Use `localhost` when running the quickstart examples locally.
