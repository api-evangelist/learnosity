entries:
- date: '2026-07-15'
  version: developer
  breaking: false
  additions:
  - api: Data API
    change: Added PUT sessions/{session_id}/adjustments to update adjustment points for sessions and responses.
  - api: Data API
    change: >-
      Added GET sessions/responses/scores/grading and PUT sessions/responses/scores/grading
      to support programmatic retrieval and management of manual grading scores with
      grader_id associations.
  - api: Data API
    change: >-
      Added adjustment_points and score_after_adjustment fields to session and response data
      returned by POST sessions/responses and POST sessions/responses/score.
  - api: Questions API
    change: Added Try again support for the clozetext Question type when using dynamic content.
  - api: Questions API
    change: >-
      Added screen reader support for rich content in drag-and-drop responses for the
      orderlist Question type.
  - api: Questions API
    change: >-
      Added support for the dynamic content try again feature in the custom Question type.
  - api: Question Editor API
    change: >-
      Added the isSimplified, isExpanded and isFactored scoring methods to the
      clozeformulaV2, imageclozeformulaV2 and multistepmath Question types.
  - api: Question Editor API
    change: Added helper text for Feedback Aide scoring options.
  - api: Assess API
    change: >-
      Added a blocking modal preventing navigation, save or submit of an Activity when a
      Question within an Item contains an invalid response.
  highlights: >-
    Data API gains score-adjustment and manual-grading endpoints; accessibility and
    dynamic-content improvements across Questions, Question Editor and Assess.
- version: v2026.2.LTS
